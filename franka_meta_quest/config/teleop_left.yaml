# VR Teleoperation Configuration (LEFT ARM)

# Controller Selection (left or right)
right_controller: false

# Velocity Limits
max_lin_vel: 0.5
max_rot_vel: 1.0
max_gripper_vel: 1.0

# Gains and Coefficients
spatial_coeff: 1.0
pos_action_gain: 1.0
rot_action_gain: 1.0
gripper_action_gain: 1.0

# Robot Matrix Reorder (maps VR axes to robot axes)
rmat_reorder: [-2, -1, -3, 4]

# Robot Frames
base_frame: "world"

# Robot Communication
publish_joint_trajectory: true
target_joint_topic: "internal/target_joint"
target_pose_topic: "internal/target_pose"

# Home pose (held Y button), in base_frame, for franka_left_grasp_point. Quaternion order: x, y, z, w.
# Recorded from the left arm on 2026-11-16 (RPY deg: -176.4, -12.5, -48.9).
home_pos: [0.392, 0.188, 0.420]
home_quat: [0.906, -0.408, 0.112, 0.016]
